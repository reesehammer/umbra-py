name: Hosted API health

# External probe of https://api.umbra-py.space/healthz. The process's own
# health check cannot see a dead proxy or a missed Monday publish, so this
# runs from GitHub Actions on the free schedule. Each result is appended to
# healthz.jsonl on the `monitoring` branch and nowhere else — main is not
# checked out for the commit and is not pushed.
#
# GitHub delays a `*/15` cron; on the free plan the run often starts hours
# later, not every 15 minutes. The history line is when the probe actually
# ran. The client timeout is 60s (health_monitor.PROBE_TIMEOUT_S): a cold
# read has taken ~25s, and a 20s cutoff recorded that as "no status".
#
# A single bad probe fails this run. An issue is opened or updated only after
# three consecutive failures, and again at most every 12
# hours while it lasts. `built_at` older than 9 days fails the run too and
# uses a separate issue. `ok` in the history file is the uptime bit; staleness
# is not downtime. The uptime percentage stays unpublished until that file
# covers 7 days.
#
# The same run also POSTs tools/list and fails if a stable core name is
# missing. Railway deploys on every merge to main, not only on the weekly
# index redeploy, so this is the check that sees those deploys. Retries live
# in umbra_py.mcp_smoke (30s per attempt) for a cold listener. It does not
# change the healthz uptime bit.
#
# GitHub may start the cron late. The history records when the probe ran.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hosted-api-health
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    # Forks have no business pushing a monitoring branch or opening issues.
    if: github.repository == 'reesehammer/umbra-py'
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Probe /healthz, record history, alert
        env:
          GH_TOKEN: ${{ github.token }}
        # Stdlib only. Do not `pip install`: a PyPI outage must not look like
        # an API outage, and the script does not import the package.
        run: python3 src/umbra_py/health_monitor.py

      # tools/list for the stable core. The module file is stdlib-only, so
      # this runs it directly and does not import the umbra_py package.
      # `!cancelled()` keeps the probe running when /healthz itself failed
      # (a stale index still has a process that can list tools). A missing
      # name prints `::error` and fails this run, same as a bad health probe.
      # Retries inside the module cover a ~25s cold start.
      - name: Probe MCP stable tool names
        if: ${{ !cancelled() }}
        run: python3 src/umbra_py/mcp_smoke.py
