name: Docker

on:
  push:
    branches: [main]
  pull_request:

# A superseded push's build is dead feedback; cancel it.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Build the self-hosting `umbra serve` image and smoke-test it end to end,
  # so a broken Dockerfile / entrypoint fails review instead of a user's first
  # `docker run`. Everything here is offline: the smoke test serves in live
  # mode (no index, no S3 walk until an actual /search), so `/` and `/healthz`
  # answer without any external network.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # Retries public.ecr.aws 429s, then mirror.gcr.io at the same digest.
      - name: Build image (serve extra)
        run: bash .github/scripts/docker-build-ci.sh

      - name: CLI passthrough works
        run: docker run --rm umbra-py:ci --version

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config >/dev/null

      - name: Start the server (live mode -- no external network)
        run: docker run -d --name umbra-serve -e UMBRA_SERVE_LIVE=1 -p 8000:8000 umbra-py:ci

      - name: Wait for /healthz
        run: |
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/healthz >/dev/null; then
              echo "healthy"; exit 0
            fi
            sleep 2
          done
          echo "server did not become healthy in time" >&2
          docker logs umbra-serve || true
          exit 1

      - name: Landing page is a STAC Catalog
        run: |
          curl -fsS http://127.0.0.1:8000/ \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['type']=='Catalog'; print('landing OK')"

      - name: /healthz reports a ready live backend
        run: |
          curl -fsS http://127.0.0.1:8000/healthz \
            | python -c "import sys,json; d=json.load(sys.stdin); assert d['ready'] is True and d['backend']=='live', d; print('healthz OK')"

      - name: Server logs
        if: always()
        run: docker logs umbra-serve || true

      - name: Cleanup
        if: always()
        run: docker rm -f umbra-serve || true

  # The image Railway builds (deploy/Dockerfile.mcp). The table lists every
  # severity. The job fails only when Trivy finds a CRITICAL CVE that already
  # has a fix, so an unfixed finding in the Debian base does not block review.
  hosted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Build hosted image
        run: |
          UMBRA_DOCKERFILE=deploy/Dockerfile.mcp \
          UMBRA_IMAGE_TAG=umbra-py:public \
          UMBRA_SKIP_EXTRAS_ARG=1 \
          bash .github/scripts/docker-build-ci.sh

      - name: Report image vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: umbra-py:public
          format: table
          exit-code: "0"
          vuln-type: os,library
          severity: LOW,MEDIUM,HIGH,CRITICAL

      - name: Fail on fixable CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: umbra-py:public
          format: table
          exit-code: "1"
          ignore-unfixed: "true"
          vuln-type: os,library
          severity: CRITICAL

      - name: Hosted image serves /livez
        run: |
          docker run -d --name umbra-public \
            -e UMBRA_FETCH_INDEX=0 -p 8000:8000 umbra-py:public
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/livez \
              | python -c "import sys,json; d=json.load(sys.stdin); assert d['status']=='ok'"; then
              echo "livez OK"
              exit 0
            fi
            sleep 2
          done
          echo "server did not serve /livez in time" >&2
          docker logs umbra-public || true
          exit 1

      - name: Server logs
        if: always()
        run: docker logs umbra-public || true

      - name: Cleanup
        if: always()
        run: docker rm -f umbra-public || true
