name: Publish catalog index

# Umbra publishes no STAC API, so searching its open-data catalog normally
# means crawling the S3 bucket. This workflow does that crawl once on a
# schedule — `umbra index build` over the whole bucket — then publishes the
# result in two forms on the rolling `catalog-index` release:
#
#   - umbra-open-data.parquet  stac-geoparquet: the whole catalog searchable
#                              in seconds by DuckDB / geopandas / pyarrow /
#                              rustac, no umbra-py install required
#   - catalog.db               the SQLite index, ready for
#                              `umbra search --local --db catalog.db`, with
#                              place labels already baked in (one reverse
#                              geocode per site, see the bake step below)
#   - catalog.pmtiles          a single-file whole-catalog vector-tile basemap
#                              (`umbra tiles --fetch`): drop straight onto a
#                              static host, or read by range request from a
#                              MapLibre page — a whole-archive map, no crawl
#   - catalog.html             a ready-to-open MapLibre GL viewer that reads the
#                              published catalog.pmtiles by range request
#   - catalog.thumbs.db        baked SAR quicklook PNGs, one per acquisition
#                              (`umbra index fetch-thumbnails`): a separate,
#                              opt-in sidecar so catalog.db stays small, topped
#                              up incrementally rather than re-baked weekly
#
# Weekly is deliberate: frequent enough to pick up new acquisitions, polite
# to Umbra's open-data bucket.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, off the whole-hour spike
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Don't crawl Umbra's bucket from forks; schedules there stay off anyway.
    if: github.repository == 'reesehammer/umbra-py'
    timeout-minutes: 120
    # Mapped here (not inline) so the optional embedding step can gate on the
    # secret being present via the `env` context, which `if:` can read.
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      UMBRA_SCENE_EMBED_MODEL: ${{ secrets.UMBRA_SCENE_EMBED_MODEL }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install umbra-py with the export extra
        run: pip install -e ".[export]"

      - name: Build full catalog index
        run: umbra index build --db catalog.db

      # Reverse-geocode the crawl into human place names before the downstream
      # artifacts are derived, so a fetched catalog.db, the parquet export and
      # the vector basemap all arrive pre-labelled ("Reykjavík, Iceland" rather
      # than a task codename) with no render-time geocoding.
      #
      # --by-site is what makes this affordable: Nominatim's usage policy caps
      # traffic at ~1 request/sec, so labelling every acquisition would take
      # hours, while one lookup per site (a task's passes share their ground)
      # is a fraction of that. Bounded by --limit and non-blocking, so a slow
      # or unavailable geocoder costs the run some labels, never the publish.
      - name: Bake place labels (non-blocking)
        continue-on-error: true
        timeout-minutes: 25
        run: umbra index bake --db catalog.db --by-site --limit 1200

      - name: Export stac-geoparquet
        run: umbra index export --db catalog.db --out umbra-open-data.parquet

      # Publish the crawl BEFORE deriving anything further from it. The order
      # matters: the first two runs of this workflow both died in the tiling
      # step below, and because that step ran first, a completed crawl, 2 725
      # baked place labels and a good parquet export were discarded with it --
      # so the release was never created at all and `umbra index fetch` 404'd
      # for the project's entire existence. The index is the promise; the
      # basemap is derived from it. A failure deriving the basemap should cost
      # the basemap, not the snapshot, so the upload of each artifact now sits
      # with the step that builds it.
      - name: Publish to the rolling catalog-index release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          summary="$(umbra index info --db catalog.db)"
          notes="Rolling snapshot of Umbra's open-data STAC catalog \
          (rebuilt weekly; last rebuilt $(date -u +%Y-%m-%d)).

          - \`umbra-open-data.parquet\` — [stac-geoparquet](https://stac-geoparquet.org/): query it directly with DuckDB, geopandas, pyarrow or rustac.
          - \`catalog.db\` — SQLite index for \`umbra search --local --db catalog.db\`, with reverse-geocoded place labels baked in, so maps, galleries and \`umbra demo\` show real place names with no render-time geocoding.
          - \`catalog.pmtiles\` — single-file whole-catalog vector basemap for \`umbra tiles --fetch\`; drop onto any static host or read by range request from a MapLibre page. Carries an \`acquisitions\` centroid layer at every zoom and a \`footprints\` polygon layer from zoom 6 up.
          - \`catalog.html\` — a ready-to-open MapLibre GL viewer over the published \`catalog.pmtiles\`.

          \`\`\`
          $summary
          \`\`\`

          Data © [Umbra](https://umbra.space/open-data/), CC BY 4.0."
          if gh release view catalog-index >/dev/null 2>&1; then
            gh release edit catalog-index --notes "$notes"
          else
            gh release create catalog-index \
              --title "Umbra open-data catalog index" --notes "$notes"
          fi
          gh release upload catalog-index \
            catalog.db umbra-open-data.parquet --clobber

      # Tile the whole catalog into a single-file vector basemap from the index
      # just built (--local, no second crawl), plus a MapLibre viewer pointed at
      # the *published* pmtiles URL so catalog.html works standalone once both
      # land on the release.
      #
      # --index-db, not --db: on a render command --db means the decibel
      # stretch, so the gather commands spell the index path --index-db. Getting
      # that wrong is what killed the first two runs; `tests/test_workflows.py`
      # now parses every invocation in this file against the real CLI, so the
      # same drift fails a pull request instead of a Monday morning.
      - name: Tile whole-catalog PMTiles basemap
        run: |
          umbra tiles --local --index-db catalog.db --out catalog.pmtiles
          python -c "import umbra_py.pmtiles as p, umbra_py.constants as c; \
          p.save_viewer(c.CATALOG_INDEX_PMTILES_URL, 'catalog.html')"

      - name: Publish the whole-catalog basemap
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload catalog-index catalog.pmtiles catalog.html --clobber

      # A quicklook per acquisition, baked once here so no viewer has to stream
      # a cloud-optimized GeoTIFF overview at render time. Two things make this
      # affordable to publish weekly:
      #
      #   - It is *incremental*. The crawl above rebuilds catalog.db from
      #     scratch, so every thumbnail column starts NULL; re-importing last
      #     week's published sidecar first means this run streams only the
      #     acquisitions added since, not the whole archive every Monday. (On
      #     the first run there is no sidecar to fetch — hence `|| true`.)
      #   - It is *bounded*. --limit caps the scenes streamed per run and
      #     --newest-first spends that budget on the freshest passes, which are
      #     what a demo or a monitoring view opens on; the rest are picked up
      #     over subsequent runs. --size 128 keeps a preview a preview: the
      #     sidecar is a separate, opt-in asset precisely because pixels dwarf
      #     the metadata every `umbra index fetch` already pays for.
      #
      # Non-blocking, and split from the upload below so a run that times out
      # mid-bake still publishes what it (and every earlier run) baked.
      - name: Bake SAR thumbnails (incremental, non-blocking)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          pip install -e ".[viz]"
          umbra index fetch-thumbnails --db catalog.db || true
          umbra index bake-thumbnails --db catalog.db \
            --size 128 --newest-first --limit 1500

      - name: Publish the thumbnail sidecar (non-blocking)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          exported="$(umbra index export-thumbnails --db catalog.db \
            --out catalog.thumbs.db | grep -oE '^Exported [0-9]+' | cut -d' ' -f2)"
          # Never clobber the accumulated published sidecar with an empty one.
          if [ "${exported:-0}" -eq 0 ]; then
            echo "No baked thumbnails to publish; leaving the released sidecar alone."
            exit 0
          fi
          gh release upload catalog-index catalog.thumbs.db --clobber
          echo "Published ${exported} baked thumbnail(s)."
          # The deterministic publish step above rewrites the notes every run,
          # so describe the sidecar once, only when that rewrite dropped it.
          body="$(gh release view catalog-index --json body -q .body)"
          case "$body" in
            *catalog.thumbs.db*) ;;
            *)
              gh release edit catalog-index --notes "$body

          - \`catalog.thumbs.db\` — baked SAR quicklook PNGs (128 px) for \`umbra index fetch-thumbnails\`: merge them into a local \`catalog.db\` and every preview reads local bytes instead of streaming a COG overview per scene. Baked newest-first and topped up weekly, so the most recent passes are covered first."
              ;;
          esac

      # Scene embeddings are model-derived and model-specific, so — unlike the
      # deterministic artifacts above — publishing them is opt-in: it needs a
      # multimodal (CLIP-family) embedding key and streams a quicklook per
      # acquisition. It runs only when the maintainer has configured
      # OPENAI_API_KEY as a repo secret, and never blocks the deterministic
      # publish (continue-on-error), so `umbra embed fetch` can pull a
      # `catalog.embed.db` beside `catalog.db` once a key is set. See
      # STRATEGY.md 5.2 ("offer it upstream"); the C5 similarity workstream.
      - name: Build and publish scene embeddings (opt-in, needs OPENAI_API_KEY)
        if: ${{ env.OPENAI_API_KEY != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install -e ".[ai,viz]"
          umbra embed build --local --index-db catalog.db \
            --bbox -180,-90,180,90 --limit 100000000 --embed-db catalog.embed.db
          model="$(umbra embed info --embed-db catalog.embed.db | sed -n 's/^ *model *: //p')"
          gh release upload catalog-index catalog.embed.db --clobber
          gh release edit catalog-index --notes "$(gh release view catalog-index --json body -q .body)

          - \`catalog.embed.db\` — scene-embedding sidecar for \`umbra embed fetch\` (visual similarity search, no rebuild). Vectors are model-specific: **embedding model \`${model}\`** — query with the matching model."
