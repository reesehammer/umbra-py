# Hosted Streamable-HTTP MCP (`umbra mcp --http`).
#
# Railway's startCommand replaces the image ENTRYPOINT in exec form, so a
# bare `mcp` is not a binary -- it has to be handed to the entrypoint.
# Dockerfile.mcp bakes UMBRA_EXTRAS=mcp,viz; no UI build-arg is required.
#
# `/data` is writable without a volume. Attach one after the first green
# deploy if you want catalog.db to survive the next one.
# Do not set UMBRA_CANOPY_TOKEN or model API keys on a public instance.
#
# `.railway.internal` is private mesh DNS. Generate a public domain for
# Claude / the Anthropic directory (`https://<service>.up.railway.app/mcp`).

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.mcp"

[deploy]
startCommand = "/bin/sh -c 'exec /usr/local/bin/docker-entrypoint.sh mcp'"
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
