# Hosted community STAC API + Streamable-HTTP MCP (`umbra serve --public`).
#
# Stays at the repo root so Railway's default Config-as-Code discovery finds it
# (no custom Config File Path). Dockerfiles / compose / entrypoint live under
# deploy/; dockerfilePath is repo-root-relative.
# Railway's startCommand replaces the image ENTRYPOINT in exec form, so the
# flag has to be handed to the entrypoint -- a bare `serve` is not on PATH
# as a binary. deploy/Dockerfile.mcp hardcodes pip install ".[mcp,viz,serve]"; do
# not set a UMBRA_EXTRAS build-arg in the Railway UI (it used to override
# the image to MCP-only and crash `umbra serve --public`).
#
# One URL, two front doors:
#   https://<service>.up.railway.app/        STAC API (`/search`, `/docs`)
#   https://<service>.up.railway.app/mcp     Streamable HTTP MCP
#
# `/data` is writable without a volume. A Railway Volume mounted at /data
# keeps catalog.db across deploys (the entrypoint chowns it, then drops
# to umbra). Do not add a Dockerfile VOLUME — the Metal builder rejects it.
# Do not set UMBRA_CANOPY_TOKEN or model API keys on a public instance
# (`--public` refuses to start if they are set).
#
# `.railway.internal` is private mesh DNS. Generate a public domain
# (`https://<service>.up.railway.app`).
#
# STAC links need no new variable. --public builds them from
# X-Forwarded-Proto and X-Forwarded-Host or Host when the peer is the edge,
# so https://api.umbra-py.space stays the origin. Optional
# UMBRA_PUBLIC_BASE_URL overrides that only as http(s)://host[:port].
# The rate limit reads X-Real-IP. UMBRA_TRUSTED_PROXY_HOPS (default 1) is
# only the rightmost X-Forwarded-For fallback. One client may hold 2 catalog
# reads. None of those need to be set for the defaults to be safe.

[build]
builder = "DOCKERFILE"
dockerfilePath = "deploy/Dockerfile.mcp"

[deploy]
startCommand = "/bin/sh -c 'exec /usr/local/bin/docker-entrypoint.sh serve --public'"
# Liveness only. `/healthz` reads the catalog (readiness) and must not gate
# the deploy: the entrypoint fetches the index before the socket listens, and
# a cold catalog read is not "the process is dead". 300s still covers that
# fetch; shortening it fails deploys that have not opened the port yet.
healthcheckPath = "/livez"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
